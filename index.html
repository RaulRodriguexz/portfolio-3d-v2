<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!--
      D-44, frente 6 — o tema é decidido AQUI, antes de qualquer folha de estilo
      e antes do bundle. Se isto virasse um efeito do React, quem escolheu
      escuro veria um quadro branco a cada carregamento — e um toggle que pisca
      branco é pior que não ter toggle.

      Só escreve o atributo; a cor mora no CSS (D-49). Sem `localStorage`
      gravado, segue a preferência do sistema, que é o que a pessoa já pediu ao
      configurar o aparelho. Envolto em try porque `localStorage` lança em
      janela privada de alguns navegadores, e um tema que derruba a página é
      pior que um tema errado.
    -->
    <script>
      ;(function () {
        try {
          var t = localStorage.getItem('tema')
          if (t !== 'dark' && t !== 'light') {
            t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          }
          if (t === 'dark') {
            var h = document.documentElement
            h.dataset.theme = 'dark'
            // fecha a janela ANTES da folha de estilo: até ela chegar não
            // existe regra de fundo nenhuma e o canvas do navegador é branco.
            // `color-scheme` inline faz o próprio navegador pintar escuro nesse
            // intervalo. Não se põe `background-color` aqui: um valor literal
            // no `<html>` venceria a regra do CSS e mataria o tom ambiente do
            // M-10, que trabalha pela variável `--ambient`.
            h.style.colorScheme = 'dark'
          }
        } catch (e) {}
      })()
    </script>

    <!-- RNF-07: SEO e preview em redes sociais. Troque a URL quando publicar. -->
    <title>Raul Rodrigues — AI &amp; Automation Developer</title>
    <meta
      name="description"
      content="Raul Rodrigues builds AI automations and agents that take repetitive work off people’s calendars. Python, LLM APIs, n8n. Moving to Dublin in October 2026, open to roles and freelance."
    />
    <meta name="author" content="Raul Rodrigues" />

    <!--
      Endereço canônico. Conferido no ar em 07/09: não existia nenhum, e o
      domínio acabou de mudar — que é exatamente quando a falta cobra caro, com
      o `.vercel.app` antigo, o apex e o `www` podendo ser indexados como
      páginas diferentes com o mesmo conteúdo.

      Aponta para o **apex**, no mesmo endereço que `og:url`, o `sitemap.xml` e
      o `robots.txt` já declaram: quatro sinais dizendo a mesma coisa.

      ⚠ Hoje o apex responde **308 para `www.raulrodrigues.dev`** — a Vercel
      pôs o `www` como domínio principal ao comprar. O canônico apontando para
      um endereço que redireciona não é erro (o buscador segue o redirecionamento),
      mas é sinal torto. O conserto é no painel, não aqui: trocar o domínio
      principal para o apex faz os quatro sinais e o servidor concordarem.
      Alternativa oposta, se o `www` for para ficar: mover os quatro para `www`.
    -->
    <link rel="canonical" href="https://raulrodrigues.dev/" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Raul Rodrigues — AI &amp; Automation Developer" />
    <meta
      property="og:description"
      content="Raul Rodrigues builds AI automations and agents that take repetitive work off people’s calendars. Python, LLM APIs, n8n. Moving to Dublin in October 2026, open to roles and freelance."
    />
    <meta property="og:url" content="https://raulrodrigues.dev" />
    <meta property="og:image" content="https://raulrodrigues.dev/og.png" />
    <meta name="twitter:card" content="summary_large_image" />


    <!-- RNF-07: JSON-LD schema.org/Person. É o que dá ao Google nome, cargo,
         cidade e perfis externos como uma entidade, não só texto solto. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Raul Rodrigues",
        "url": "https://raulrodrigues.dev",
        "image": "https://raulrodrigues.dev/og.png",
        "jobTitle": "AI & Automation Developer",
        "email": "mailto:raulrodrigues.mldev@gmail.com",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Dublin",
          "addressCountry": "IE"
        },
        "knowsLanguage": ["pt-BR", "en"],
        "knowsAbout": [
          "AI Automation",
          "Python",
          "n8n",
          "LLM APIs",
          "RAG",
          "Machine Learning",
          "React"
        ],
        "sameAs": [
          "https://www.linkedin.com/in/raulrodriguexz",
          "https://github.com/RaulRodriguexz"
        ]
      }
    </script>

    <meta name="theme-color" content="#fbfbfe" />

    <!--
      Tipografia self-hospedada (D-62 a). Antes havia dois `preconnect` e uma
      folha do Google Fonts aqui, e a folha bloqueava a pintura por 825 ms —
      medido, e era a maior parcela do caminho crítico da primeira pintura no
      celular. Os `preconnect` saíram junto: eles serviam para abrir a conexão
      com um domínio que não é mais visitado.

      O `@font-face` mora no `src/index.css`, junto do resto do tema. Aqui fica
      só o `preload`, porque a fonte é referenciada de dentro do CSS e o
      navegador só descobriria os `.woff2` depois de baixar e interpretar a
      folha — o `preload` corta esse salto.

      **Só as duas faces que o site usa**, 400 e 700 normais, conferidas no
      código antes de escolher: 13,9 KB somados, contra as seis faces que o
      `<link>` antigo pedia. `crossorigin` é obrigatório mesmo sendo o mesmo
      domínio, porque fonte sempre viaja em modo CORS — sem ele o navegador
      baixa duas vezes e o preload vira peso morto.
    -->
    <link
      rel="preload"
      href="/fonts/sansation-400.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/sansation-700.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
