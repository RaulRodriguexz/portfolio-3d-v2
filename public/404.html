<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Page not found — Raul Rodrigues</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Sansation:wght@300;400;700&display=swap"
    />

    <!--
      Estilo embutido de propósito: o CSS do site tem hash no nome e muda a cada
      build. Uma página de erro que depende do bundle é uma página de erro que
      quebra junto com ele. Aqui os tokens são os mesmos do @theme, copiados à
      mão — as duas cores e a fonte, nada além.

      Sem cena 3D e sem fio: é uma dobra, não um projeto.
    -->
    <style>
      :root {
        --canvas: #fbfbfe;
        --ink: #000000;
        --muted: #4a4a5a;
        --primary-deep: #6e11b0;
      }
      * { box-sizing: border-box; }
      html { background-color: var(--canvas); }
      body {
        margin: 0;
        min-height: 100svh;
        display: flex;
        align-items: center;
        color: var(--ink);
        font-family: Sansation, ui-sans-serif, system-ui, sans-serif;
        font-weight: 400;
        -webkit-font-smoothing: antialiased;
      }
      main {
        margin-inline: auto;
        width: 100%;
        max-width: 96rem;
        padding-inline: 1.5rem;
      }
      @media (min-width: 640px) { main { padding-inline: 2rem; } }
      @media (min-width: 1024px) { main { padding-inline: 3rem; } }
      @media (min-width: 1280px) { main { padding-inline: 4rem; } }

      .rotulo {
        margin: 0 0 1.25rem;
        color: var(--primary-deep);
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 0.75rem;
        letter-spacing: 0.2em;
        text-transform: uppercase;
      }
      h1 {
        margin: 0;
        font-size: clamp(2.6rem, 9vw, 5.4rem);
        font-weight: 700;
        line-height: 0.96;
        letter-spacing: -0.02em;
      }
      p.linha {
        margin: 1.75rem 0 0;
        max-width: 36rem;
        color: var(--muted);
        font-size: 1rem;
        line-height: 1.65;
      }
      a.voltar {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        margin-top: 2.5rem;
        border-radius: 9999px;
        background: var(--primary-deep);
        padding: 0.75rem 1.5rem;
        color: #fff;
        font-size: 0.875rem;
        text-decoration: none;
        transition: opacity 200ms;
      }
      a.voltar:hover { opacity: 0.85; }
      a.voltar:focus-visible {
        outline: 2px solid var(--primary-deep);
        outline-offset: 3px;
      }
      a.voltar span { transition: transform 200ms; }
      a.voltar:hover span { transform: translateX(2px); }
    </style>
  </head>

  <body>
    <main>
      <p class="rotulo">Error 404</p>
      <h1>Page not found</h1>
      <p class="linha">
        This address doesn’t exist on this site. Everything worth seeing is on the
        home page — the work, the stack and the way to reach me.
      </p>
      <a class="voltar" href="/">
        Back to the site
        <span aria-hidden="true">→</span>
      </a>
    </main>
  </body>
</html>
